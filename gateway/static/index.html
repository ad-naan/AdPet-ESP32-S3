<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdPet Gateway 管理</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="top-bar">
    <div class="brand">
      <div class="brand-icon">🐾</div>
      <div class="brand-text">AdPet <span>Gateway</span></div>
    </div>
    <div class="status-badge"><div class="status-dot"></div>运行中</div>
  </header>

  <main class="main-content">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon purple">📡</div>
        <div><div class="stat-value" id="statDevices">0</div><div class="stat-label">已注册设备</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">💬</div>
        <div><div class="stat-value" id="statMessages">0</div><div class="stat-label">总消息数</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon amber">⏱️</div>
        <div><div class="stat-value" id="statUptime">-</div><div class="stat-label">服务状态</div></div>
      </div>
    </div>

    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="devices">📱 设备管理</button>
      <button class="tab-btn" data-tab="config">⚙️ 网关配置</button>
    </nav>

    <!-- 设备管理 -->
    <div class="tab-panel active" id="panel-devices">
      <div class="devices-layout">
        <div class="card">
          <div class="card-header">
            <div><div class="card-title">设备列表</div><div class="card-subtitle">点击设备查看对话记录</div></div>
            <button class="btn btn-ghost btn-sm" onclick="loadDevices()">🔄 刷新</button>
          </div>
          <div class="device-list" id="deviceList">
            <div class="empty-state"><div class="empty-state-icon">📡</div><div class="empty-state-title">暂无设备</div><p>ESP32 首次请求后自动注册</p></div>
          </div>
        </div>
        <div class="card" id="chatCard">
          <div class="card-header">
            <div><div class="card-title" id="chatTitle">对话记录</div><div class="card-subtitle" id="chatSubtitle">选择设备查看</div></div>
            <div style="display:flex;gap:6px">
              <button class="btn btn-ghost btn-sm" id="btnClear" style="display:none" onclick="clearMessages()">🗑️ 清空</button>
              <button class="btn btn-danger btn-sm" id="btnDelete" style="display:none" onclick="deleteDevice()">删除设备</button>
            </div>
          </div>
          <div class="chat-messages" id="chatMessages">
            <div class="chat-empty"><div class="chat-empty-icon">💬</div><p>选择左侧设备查看对话</p></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 配置面板 -->
    <div class="tab-panel" id="panel-config">
      <div class="card">
        <div class="card-header">
          <div><div class="card-title">网关配置</div><div class="card-subtitle">配置 API 和模型参数（保存至数据库）</div></div>
          <button class="btn btn-primary btn-sm" onclick="saveConfig()">💾 保存</button>
        </div>
        <div class="form-grid" id="configForm">
          <div class="form-group"><label class="form-label">MIMO API Key</label><input class="form-input" id="cfg-mimo_api_key" type="password" placeholder="sk-..."><span class="form-hint">MIMO 平台 API 密钥</span></div>
          <div class="form-group"><label class="form-label">MIMO Base URL</label><input class="form-input" id="cfg-mimo_base_url" placeholder="https://api.xiaomimimo.com/v1"></div>
          <div class="form-group"><label class="form-label">ASR 模型</label><input class="form-input" id="cfg-asr_model" placeholder="mimo-v2.5-asr"></div>
          <div class="form-group"><label class="form-label">LLM 模型</label><input class="form-input" id="cfg-llm_model" placeholder="mimo-v2.5"></div>
          <div class="form-group"><label class="form-label">TTS 模型</label><input class="form-input" id="cfg-tts_model" placeholder="mimo-v2.5-tts"></div>
          <div class="form-group"><label class="form-label">TTS 音色</label><input class="form-input" id="cfg-tts_voice" placeholder="Chloe"></div>
          <div class="form-group"><label class="form-label">最大历史轮数</label><input class="form-input" id="cfg-max_history_turns" type="number" placeholder="8"></div>
          <div class="form-group"><label class="form-label">最大 WAV 大小</label><input class="form-input" id="cfg-max_wav_size" type="number" placeholder="225280"></div>
          <div class="form-group full"><label class="form-label">系统提示</label><textarea class="form-textarea" id="cfg-server_system_prompt" rows="3" placeholder="你是 AdPet..."></textarea><span class="form-hint">所有设备共享的人设提示</span></div>
          <div class="form-group full"><label class="form-label">Gateway API Key</label><input class="form-input" id="cfg-gateway_api_key" type="password" placeholder="留空不验证"><span class="form-hint">ESP32 请求的 Bearer token</span></div>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="/static/app.js"></script>
</body>
</html>
